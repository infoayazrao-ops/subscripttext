<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="md-title md-desc">
  <title id="md-title">Markdown subscript with HTML tags versus Unicode paste</title>
  <desc id="md-desc">Side-by-side example of H2O written with HTML sub tags and as Unicode subscript.</desc>
  <rect width="720" height="300" fill="#0d1117"/>
  <rect x="16" y="16" width="336" height="220" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="368" y="16" width="336" height="220" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="48" fill="#8b949e" font-family="Consolas, monospace" font-size="13">README.md</text>
  <text x="36" y="96" fill="#c9d1d9" font-family="Consolas, monospace" font-size="16">H&lt;sub&gt;2&lt;/sub&gt;O</text>
  <text x="36" y="132" fill="#c9d1d9" font-family="Consolas, monospace" font-size="16">x&lt;sup&gt;2&lt;/sup&gt;</text>
  <text x="36" y="200" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="14">Renders on GitHub</text>
  <text x="388" y="48" fill="#8b949e" font-family="Consolas, monospace" font-size="13">Unicode paste</text>
  <text x="388" y="96" fill="#c9d1d9" font-family="Consolas, monospace" font-size="22">H&#8322;O</text>
  <text x="388" y="144" fill="#c9d1d9" font-family="Consolas, monospace" font-size="22">x&#178;</text>
  <text x="388" y="200" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">Works where HTML is stripped</text>
  <text x="360" y="274" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">Use tags in GitHub. Use Unicode in Discord, Canva, and chat.</text>
</svg>
